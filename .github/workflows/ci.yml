name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU learning and development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[all]'
      - name: Correctness suite
        run: python -m pytest -q --cov=belieftown --cov-report=term
      - name: Recorded showcase and audit smoke
        run: |
          python -m belieftown solve --output artifacts/ci-audit.json
          python -m belieftown verify artifacts/ci-audit.json
          python -m belieftown export --output artifacts/ci-showcase.html
      - name: Execute research notebooks
        if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        run: python -m belieftown notebooks
