[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "belieftown"
version = "1.0.0"
description = "A counterfactual NPC debugger with verified information patches"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "BeliefTown contributors"}]
dependencies = ["numpy>=1.26,<3"]
keywords = ["npc", "game-ai", "counterfactual", "belief-state", "jupyter"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.urls]
Homepage = "https://github.com/VeinDevTtv/BeliefTown"
Repository = "https://github.com/VeinDevTtv/BeliefTown"
Documentation = "https://github.com/VeinDevTtv/BeliefTown/blob/main/docs/START_HERE.md"
Issues = "https://github.com/VeinDevTtv/BeliefTown/issues"

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
ml = ["torch>=2.2,<3"]
notebook = ["jupyterlab>=4,<5", "nbformat>=5.9,<6", "nbclient>=0.10,<1", "matplotlib>=3.8,<4"]
all = ["torch>=2.2,<3", "jupyterlab>=4,<5", "nbformat>=5.9,<6", "nbclient>=0.10,<1", "matplotlib>=3.8,<4"]

[project.scripts]
belieftown = "belieftown.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
belieftown = ["static/*", "scenes/*.json"]
